
services:
  mysql:
    image: mysql:8.0
    container_name: reviewme-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: demo30

    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reviewme-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/demo30?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REVIEWME_ADMIN_USERNAME: ${REVIEWME_ADMIN_USERNAME:-admin}
      REVIEWME_ADMIN_PASSWORD: ${REVIEWME_ADMIN_PASSWORD:?Set REVIEWME_ADMIN_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
