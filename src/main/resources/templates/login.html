<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | ReviewMe</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/gameflix.css}"></head>
<body><main class="page-wrap" style="max-width:620px"><a th:href="@{/}" class="page-link-back">← Back to collection</a><section class="panel p-4 p-md-5 mt-4"><div class="eyebrow mb-2">Welcome back</div><h1 class="section-title mb-3">Log in to ReviewMe</h1><p class="muted">Your reviews and community activity stay connected to your account.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${success}" class="alert alert-gf" th:text="${success}"></div><form th:action="@{/login}" method="post"><input type="hidden" name="next" th:value="${next}"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required maxlength="60"><label class="form-label" for="password">Password</label><input class="form-control mb-4" id="password" type="password" name="password" autocomplete="current-password" required><button class="btn btn-gf w-100" type="submit">Log in</button></form><p class="mt-4 mb-0">New to ReviewMe? <a th:href="@{/register}">Create an account</a></p></section></main></body></html>
