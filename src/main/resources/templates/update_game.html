<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Update game | ReviewMe</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/gameflix.css}"></head>
<body>
<nav class="navbar navbar-gf navbar-dark py-3"><div class="container-fluid px-4 px-lg-5"><a class="navbar-brand d-flex align-items-center m-0" th:href="@{/}"><span class="brand-mark">R</span><span class="brand-name">Review<span>Me</span></span></a><a th:href="@{/}" class="btn btn-quiet">← All games</a></div></nav>
<main class="page-wrap" style="max-width:800px"><div class="eyebrow mb-2">Keep your library accurate</div><h1 class="hero-title mb-3">Edit game.</h1><p class="hero-copy mb-4">Update the details shown in your ReviewMe collection.</p>
<section class="panel p-4 p-md-5"><form th:action="@{/saveGame}" th:object="${game}" method="post"><input type="hidden" th:field="*{id}">
<div class="mb-4"><label for="title" class="form-label">Game title</label><input id="title" type="text" th:field="*{title}" class="form-control" maxlength="150" required></div>
<div class="row g-3"><div class="col-md-6 mb-3"><label for="genre" class="form-label">Genre</label><input id="genre" type="text" th:field="*{genre}" class="form-control" maxlength="80" required></div><div class="col-md-6 mb-3"><label for="platform" class="form-label">Platform</label><input id="platform" type="text" th:field="*{platform}" class="form-control" maxlength="100" required></div></div>
<div class="mb-4"><label for="releaseYear" class="form-label">Release year</label><input id="releaseYear" type="text" th:field="*{releaseYear}" class="form-control" maxlength="20" required></div>
<div class="d-flex flex-column flex-sm-row gap-2"><button type="submit" class="btn btn-gf">Save changes →</button><a th:href="@{/}" class="btn btn-quiet px-4">Cancel</a></div></form></section></main></body></html>
