<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | ReviewMe</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/gameflix.css}"></head>
<body><main class="page-wrap" style="max-width:620px"><a th:href="@{/}" class="page-link-back">← Back to collection</a><section class="panel p-4 p-md-5 mt-4"><div class="eyebrow mb-2">Join the community</div><h1 class="section-title mb-3">Create your account</h1><p class="muted">Create a regular user account. An admin can grant creator access later.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/register}" method="post"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" minlength="3" maxlength="60" required><label class="form-label" for="password">Password</label><input class="form-control mb-4" id="password" type="password" name="password" autocomplete="new-password" minlength="8" required><div class="muted small mb-3">Use at least 8 characters.</div><button class="btn btn-gf w-100" type="submit">Create account</button></form><p class="mt-4 mb-0">Already registered? <a th:href="@{/login}">Log in</a></p></section></main></body></html>
